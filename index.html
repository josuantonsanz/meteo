<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Previsión meteorológica</title>
<meta name="description" content="Previsión por horas comparando AEMET, ECMWF, ICON y WeatherNext 2.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161c21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meteo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
<div class="in">
<div class="top">
<h1>Previsión meteorológica</h1>
<button id="reload" class="iconbtn" aria-label="Actualizar datos" title="Actualizar datos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9h-5.5"/></svg></button>
</div>
<p class="sub">AEMET, ECMWF, ICON y WeatherNext 2</p>
<nav id="cities" class="chips" aria-label="Localidad"></nav>
</div>
</header>
<main>
<div id="out" aria-live="polite"></div>
<details id="plc"><summary>Lugares</summary>
<div id="plist"></div>
<p><input id="q" type="search" placeholder="Buscar un lugar (pueblo, ciudad, colegio…)" aria-label="Buscar un lugar"> <button id="find">Buscar</button> <button id="reset">Restaurar lugares iniciales</button></p>
<div id="pres"></div>
</details>
<footer>
<p id="notes"></p>
<p>Datos de AEMET y de Open-Meteo (CC BY 4.0). Búsqueda de lugares: OpenStreetMap. La probabilidad de lluvia de WeatherNext 2 es la proporción de sus escenarios con lluvia; los modelos que no la ofrecen aparecen con un guion.</p>
</footer>
</main>
<nav id="views" class="tabs" aria-label="Vista"></nav>
<script src="app.js"></script>
</body>
</html>
